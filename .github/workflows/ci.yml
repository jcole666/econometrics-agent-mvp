name: CI

on:
  push:
    branches:
      - master
      - "iter/**"
  pull_request:

jobs:
  backend:
    name: Python 测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sidecar/requirements.txt

      # 工作目录必须是 desktop-app，否则 import sidecar 会失败
      - name: 运行 pytest
        run: python -m pytest sidecar/tests -q

  frontend:
    name: 前端类型检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-app/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: desktop-app/app/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck
